name: Build .mcpb extension

# Triggers:
#   - tag push matching v*.*.* — builds the universal .mcpb, attaches it to the
#     GitHub Release, and publishes the server to the MCP Registry.
#   - manual workflow_dispatch — builds a preview artifact (no release, no publish).
#
# The runtime is pure JavaScript (node:sqlite + file-based AES-256-GCM; no native
# modules after the keytar/sqlcipher removal), so a SINGLE universal .mcpb runs on
# every platform — no per-platform build matrix needed.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write   # release upload
  id-token: write   # MCP Registry OIDC auth

jobs:
  build:
    name: Build universal .mcpb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build universal .mcpb
        run: node dxt/build.mjs

      - name: Verify artifact exists
        shell: bash
        run: |
          ls -la dxt/build/*.mcpb
          ls -la dxt/build/*.mcpb.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: mcpb-universal
          path: |
            dxt/build/*.mcpb
            dxt/build/*.mcpb.sha256
          retention-days: 30

  release:
    name: Attach to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout (for changelog)
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0

      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: mcpb-universal
          path: release-files

      - name: Build release notes preamble
        run: |
          {
            echo '## Claude Desktop Extension (.mcpb)'
            echo ''
            echo 'Single **universal** `.mcpb` (pure-JS runtime, no native binaries). Declared/tested platforms: **macOS and Windows**. It also runs on Linux, but Linux is not part of the tested/declared support matrix yet.'
            echo ''
            echo 'Install: Claude Desktop → Settings → Extensions → Install Extension… and choose the `.mcpb`.'
            echo ''
            echo '### Checksum'
            echo ''
            echo '```'
            cat release-files/*.sha256 || true
            echo '```'
            echo ''
            echo 'Full changelog: see [CHANGELOG.md](./CHANGELOG.md).'
          } > release-body.md

      - name: Create / update release
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090  # v2.4.1
        with:
          files: release-files/*
          body_path: release-body.md
          draft: false
          prerelease: false
          append_body: true

  publish-registry:
    name: Publish to MCP Registry
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout (for server.json)
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0

      - name: Download artifact (for SHA-256)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: mcpb-universal
          path: release-files

      - name: Patch server.json (version, asset URL, fileSha256)
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"            # e.g. v2.17.16
          VERSION="${TAG#v}"                  # e.g. 2.17.16
          ASSET="imap-mcp-pro-${VERSION}.mcpb"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
          SHA="$(openssl dgst -sha256 "release-files/${ASSET}" | awk '{print $2}')"
          echo "version=$VERSION  sha=$SHA"
          echo "url=$URL"
          jq --arg v "$VERSION" --arg url "$URL" --arg sha "$SHA" '
            .version = $v
            | .packages[0].identifier = $url
            | .packages[0].fileSha256 = $sha
          ' server.json > server.tmp && mv server.tmp server.json
          cat server.json

      - name: Install mcp-publisher (pinned + checksum-verified)
        # Pinned to a specific release and SHA-256-verified before extraction —
        # no `latest`, no pipe-to-tar (closes the Aikido "remote pull without
        # integrity verification" finding). Job runs on ubuntu-latest → linux_amd64.
        run: |
          set -euo pipefail
          VERSION=v1.7.9
          ASSET=mcp-publisher_linux_amd64.tar.gz
          SHA256=ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
          curl -fsSL -o "$ASSET" "https://github.com/modelcontextprotocol/registry/releases/download/${VERSION}/${ASSET}"
          echo "${SHA256}  ${ASSET}" | sha256sum -c -
          tar xzf "$ASSET" mcp-publisher

      - name: Authenticate (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
